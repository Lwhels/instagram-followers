name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run test suite with pytest and coverage
      run: |
        pytest --cov=instagram_analyzer --cov-report=xml --cov-report=term

    - name: Verify CLI functionality
      run: |
        python -m instagram_analyzer --help
        python -m instagram_analyzer demo --db test_demo.db
