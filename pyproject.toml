[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-follower-analyzer"
version = "2.0.0"
description = "Privacy-first Instagram follower analyzer with interactive Tinder-style swipe triage and live recomputation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Lucas Wheeler" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-WebKit>=10.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
instagram-analyzer = "instagram_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["instagram_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
